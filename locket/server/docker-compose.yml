# docker compose up -d --build   (install.sh does this for you)
# Caddy gets a free HTTPS certificate for $DOMAIN automatically.
services:
  api:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      # Caddy sits in front: the client address is in X-Forwarded-For (rate limits).
      TRUST_PROXY: "1"
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
    restart: unless-stopped

  caddy:
    image: mirror.gcr.io/library/caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
