# docker compose up -d --build
# Caddy gets a free HTTPS certificate for $DOMAIN automatically.
services:
  api:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      APNS_KEY_PATH: /secrets/AuthKey.p8
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
