# Xcode project description for XcodeGen (https://github.com/yonaskolb/XcodeGen).
#   brew install xcodegen && xcodegen generate && open Locket.xcodeproj
name: Locket

options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true

settings:
  base:
    # ↓↓↓ Change these three ↓↓↓
    BUNDLE_ID: com.example.locket            # your own unique bundle id
    DEVELOPMENT_TEAM: ""                     # Apple Developer Team ID (10 characters)
    API_BASE_URL: https://locket.example.com # address of the server from ../server
    # ↑↑↑
    APS_ENVIRONMENT: development # TestFlight builds override this with production
    LOCKET_DEMO: "NO" # YES = browser demo (Appetize): no server, data lives in the app
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Locket:
    type: application
    platform: iOS
    sources:
      - path: Locket
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(LOCKET_PROFILE_APP)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Locket/Info.plist
      properties:
        CFBundleDisplayName: Locket
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait camera app: full screen only, so iOS doesn't ask for every orientation.
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: Чтобы снимать фото для друзей.
        NSLocalNetworkUsageDescription: Чтобы подключиться к тестовому серверу в твоей сети.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID)
            CFBundleURLSchemes: [locket]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        APIBaseURL: $(API_BASE_URL)
        KeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID).shared
        LocketDemo: $(LOCKET_DEMO)
    entitlements:
      path: Locket/Locket.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        keychain-access-groups: [$(AppIdentifierPrefix)$(BUNDLE_ID).shared]
    dependencies:
      - target: NotificationService
      - target: NotificationContent
      - target: LocketWidget

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).NotificationService
        PROVISIONING_PROFILE_SPECIFIER: $(LOCKET_PROFILE_NOTIFICATION_SERVICE)
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Locket Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        APIBaseURL: $(API_BASE_URL)
        KeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  NotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationContent
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).NotificationContent
        PROVISIONING_PROFILE_SPECIFIER: $(LOCKET_PROFILE_NOTIFICATION_CONTENT)
    info:
      path: NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: Locket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        APIBaseURL: $(API_BASE_URL)
        KeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: PHOTO_RATING
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionUserInteractionEnabled: true
            UNNotificationExtensionInitialContentSizeRatio: 1.6
    entitlements:
      path: NotificationContent/NotificationContent.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(BUNDLE_ID).shared]

  LocketWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LocketWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).widget
        PROVISIONING_PROFILE_SPECIFIER: $(LOCKET_PROFILE_WIDGET)
    info:
      path: LocketWidget/Info.plist
      properties:
        CFBundleDisplayName: Locket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        APIBaseURL: $(API_BASE_URL)
        KeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LocketWidget/LocketWidget.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(BUNDLE_ID).shared]

schemes:
  Locket:
    build:
      targets:
        Locket: all
        NotificationService: all
        NotificationContent: all
        LocketWidget: all
    run:
      config: Debug
    archive:
      config: Release
