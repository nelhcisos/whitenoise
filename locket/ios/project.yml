# Xcode project description for XcodeGen (https://github.com/yonaskolb/XcodeGen).
#   brew install xcodegen && xcodegen generate && open Locket.xcodeproj
name: Locket

options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true

settings:
  base:
    # ↓↓↓ Change these three ↓↓↓
    BUNDLE_ID: com.example.locket            # your own unique bundle id
    DEVELOPMENT_TEAM: ""                     # Apple Developer Team ID (10 characters)
    API_BASE_URL: https://locket.example.com # address of the server from ../server
    # ↑↑↑
    APP_GROUP_ID: group.$(BUNDLE_ID)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Locket:
    type: application
    platform: iOS
    sources:
      - path: Locket
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Locket/Info.plist
      properties:
        CFBundleDisplayName: Locket
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: Чтобы снимать фото для друзей.
        NSLocalNetworkUsageDescription: Чтобы подключиться к тестовому серверу в твоей сети.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID)
            CFBundleURLSchemes: [locket]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        APIBaseURL: $(API_BASE_URL)
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: Locket/Locket.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - target: NotificationService
      - target: LocketWidget

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).NotificationService
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Locket Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        APIBaseURL: $(API_BASE_URL)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  LocketWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LocketWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).widget
    info:
      path: LocketWidget/Info.plist
      properties:
        CFBundleDisplayName: Locket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        APIBaseURL: $(API_BASE_URL)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LocketWidget/LocketWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

schemes:
  Locket:
    build:
      targets:
        Locket: all
        NotificationService: all
        LocketWidget: all
    run:
      config: Debug
    archive:
      config: Release
