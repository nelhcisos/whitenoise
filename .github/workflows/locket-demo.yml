name: Locket → demo in the browser

# Builds the app in demo mode (no server: data lives in the app) for the iOS
# simulator and uploads it to Appetize, which streams it to a web page.
# Needs the repository secret APPETIZE_API_TOKEN (see locket/README.md).
# The link stays the same between builds; it is printed in the run summary.

on:
  push:
    paths:
      - "locket/ios/**"
      - ".github/workflows/locket-demo.yml"
  workflow_dispatch:

concurrency:
  group: locket-demo
  cancel-in-progress: true

jobs:
  demo:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: locket/ios
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the Appetize token
        id: token
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Демо не загружено"
              echo "Добавь секрет **APPETIZE_API_TOKEN** — как это сделать, написано в locket/README.md, раздел «Демо в браузере»."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that Appetize accepts the token
        if: steps.token.outputs.present == 'true'
        run: |
          token=$(printf '%s' "$APPETIZE_API_TOKEN" | tr -d '[:space:]')
          echo "Token: ${#token} characters"
          code=$(curl -sS -o "$RUNNER_TEMP/check.json" -w '%{http_code}' https://api.appetize.io/v1/apps -H "X-API-KEY: $token")
          echo "Appetize answered HTTP $code: $(head -c 300 "$RUNNER_TEMP/check.json")"
          if [ "$code" != "200" ]; then
            echo "::error title=Appetize не принял токен::HTTP $code. Создай токен заново (Organization → API Tokens) и обнови секрет APPETIZE_API_TOKEN."
            exit 1
          fi

      - name: Build the demo for the simulator
        if: steps.token.outputs.present == 'true'
        run: |
          brew install xcodegen
          xcodegen generate
          set +e
          xcodebuild build \
            -project Locket.xcodeproj \
            -scheme Locket \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            LOCKET_DEMO=YES \
            BUNDLE_ID=com.example.locketdemo \
            API_BASE_URL=https://demo.invalid > demo.log 2>&1
          status=$?
          grep -E "/locket/ios/.*: (warning|error):" demo.log | sort -u
          tail -n 20 demo.log
          exit $status

      - name: Upload to Appetize
        if: steps.token.outputs.present == 'true'
        run: |
          set -uo pipefail
          # A token pasted from a phone often carries a trailing space or newline.
          token=$(printf '%s' "$APPETIZE_API_TOKEN" | tr -d '[:space:]')
          echo "Token: ${#token} characters"
          products="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator"
          (cd "$products" && zip -qry "$RUNNER_TEMP/Locket-demo.zip" Locket.app)
          ls -lh "$RUNNER_TEMP/Locket-demo.zip"
          api=https://api.appetize.io/v1/apps

          # Reuse the app uploaded before, so the link never changes.
          code=$(curl -sS -o "$RUNNER_TEMP/apps.json" -w '%{http_code}' "$api" -H "X-API-KEY: $token")
          if [ "$code" != "200" ]; then
            echo "::error title=Appetize не принял токен::Список приложений: HTTP $code — $(head -c 500 "$RUNNER_TEMP/apps.json")"
            exit 1
          fi
          key=$(jq -r '[.data[]? | select(.note == "Locket demo")][0].publicKey // empty' "$RUNNER_TEMP/apps.json")
          target=$api
          if [ -n "$key" ]; then target="$api/$key"; fi

          code=$(curl -sS -o "$RUNNER_TEMP/upload.json" -w '%{http_code}' -X POST "$target" \
            -H "X-API-KEY: $token" \
            -F "file=@$RUNNER_TEMP/Locket-demo.zip" \
            -F "platform=ios" \
            -F "note=Locket demo" \
            -F "appPermissions.run=public")
          if [ "$code" != "200" ]; then
            echo "::error title=Загрузка в Appetize не удалась::HTTP $code — $(head -c 500 "$RUNNER_TEMP/upload.json")"
            exit 1
          fi
          key=$(jq -r '.publicKey // empty' "$RUNNER_TEMP/upload.json")
          if [ -z "$key" ]; then
            echo "::error::Appetize не вернул publicKey: $(head -c 500 "$RUNNER_TEMP/upload.json")"
            exit 1
          fi
          link="https://appetize.io/app/$key"
          echo "::notice title=Демо в браузере::$link"
          {
            echo "### Демо Locket в браузере"
            echo ""
            echo "$link"
            echo ""
            echo "Пароль **1234** — готовый аккаунт «барсук». Любой другой — новый аккаунт."
          } >> "$GITHUB_STEP_SUMMARY"
