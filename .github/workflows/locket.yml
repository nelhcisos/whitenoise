name: Locket

on:
  push:
    paths:
      - "locket/**"
      - ".github/workflows/locket.yml"
  pull_request:
    paths:
      - "locket/**"
      - ".github/workflows/locket.yml"
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: locket/server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: TestFlight signing script
        run: node --test ../ios/ci/*.test.mjs

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: locket/ios
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for the simulator (no signing)
        run: |
          xcodebuild -version
          set +e
          xcodebuild build \
            -project Locket.xcodeproj \
            -scheme Locket \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          echo "::group::Warnings and errors in our sources"
          grep -E "/locket/ios/.*: (warning|error):" build.log | sort -u
          echo "::endgroup::"
          tail -n 40 build.log
          exit $status
      - name: Release build for iPhone, as TestFlight does it (no signing)
        run: |
          set +e
          xcodebuild archive \
            -project Locket.xcodeproj \
            -scheme Locket \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Locket.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            BUNDLE_ID=com.example.locketci \
            API_BASE_URL=https://locket.example.com \
            APS_ENVIRONMENT=production \
            CURRENT_PROJECT_VERSION=1 \
            LOCKET_PROFILE_APP="Locket CI app" > archive.log 2>&1
          status=$?
          grep -E "/locket/ios/.*: (warning|error):" archive.log | sort -u
          tail -n 15 archive.log
          exit $status
