# Builds the iOS app on GitHub's Mac and uploads it to TestFlight — no Mac needed.
# Run it from the Actions tab: "Locket → TestFlight" → Run workflow.
# Secrets it needs are described in locket/README.md.
name: Locket → TestFlight

on:
  workflow_dispatch:

concurrency: locket-testflight

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: locket/ios
    env:
      LOCKET_TEAM_ID: ${{ secrets.LOCKET_TEAM_ID }}
      LOCKET_BUNDLE_ID: ${{ secrets.LOCKET_BUNDLE_ID }}
      LOCKET_API_URL: ${{ secrets.LOCKET_API_URL }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check secrets
        run: |
          missing=""
          for name in LOCKET_TEAM_ID LOCKET_BUNDLE_ID LOCKET_API_URL ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing. Settings → Secrets and variables → Actions → New repository secret (см. locket/README.md)."
            exit 1
          fi
          case "$LOCKET_API_URL" in https://*) ;; *) echo "::error::LOCKET_API_URL должен начинаться с https://"; exit 1 ;; esac

      - name: Key and certificate request
        run: |
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          echo "SIGNING_DIR=$dir" >> "$GITHUB_ENV"
          printf '%s\n' "$ASC_KEY_P8" > "$dir/AuthKey.p8"
          /usr/bin/openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$dir/dist.key" -out "$dir/dist.csr" -subj "/CN=Locket CI/O=Locket" 2>/dev/null

      - name: Bundle IDs, temporary certificate and profiles
        run: node ci/asc.mjs prepare

      - name: Install the certificate
        run: |
          dir="$SIGNING_DIR"
          password="$(uuidgen)"
          /usr/bin/openssl x509 -inform DER -in "$dir/dist.cer" -out "$dir/dist.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$dir/dist.key" -in "$dir/dist.pem" \
            -out "$dir/dist.p12" -passout "pass:$password"
          keychain="$dir/ci.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$dir/dist.p12" -k "$keychain" -P "$password" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed 's/"//g')
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and sign
        run: |
          set +e
          xcodebuild archive \
            -project Locket.xcodeproj \
            -scheme Locket \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$SIGNING_DIR/Locket.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            DEVELOPMENT_TEAM="$LOCKET_TEAM_ID" \
            BUNDLE_ID="$LOCKET_BUNDLE_ID" \
            API_BASE_URL="$LOCKET_API_URL" \
            APS_ENVIRONMENT=production \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            LOCKET_PROFILE_APP="$LOCKET_PROFILE_APP" \
            LOCKET_PROFILE_NOTIFICATION_SERVICE="$LOCKET_PROFILE_NOTIFICATION_SERVICE" \
            LOCKET_PROFILE_NOTIFICATION_CONTENT="$LOCKET_PROFILE_NOTIFICATION_CONTENT" \
            LOCKET_PROFILE_WIDGET="$LOCKET_PROFILE_WIDGET" \
            > archive.log 2>&1
          status=$?
          grep -E "(error|warning):" archive.log | grep -v "^ld: warning" | sort -u | head -n 60
          tail -n 25 archive.log
          exit $status

      - name: Upload to TestFlight
        run: |
          set +e
          xcodebuild -exportArchive \
            -archivePath "$SIGNING_DIR/Locket.xcarchive" \
            -exportOptionsPlist "$SIGNING_DIR/ExportOptions.plist" \
            -exportPath "$SIGNING_DIR/export" \
            -authenticationKeyPath "$SIGNING_DIR/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1
          status=$?
          tail -n 40 export.log
          if [ $status -eq 0 ]; then
            echo "::notice::Сборка $GITHUB_RUN_NUMBER загружена. Через 10–30 минут она появится в App Store Connect → TestFlight."
          fi
          exit $status

      - name: Revoke the temporary certificate
        if: always()
        run: |
          [ -n "$SIGNING_DIR" ] && node ci/asc.mjs cleanup || true
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$SIGNING_DIR"
